# Gateway de origem única: o navegador fala apenas com este host, então o cookie de sessão
# é same-origin (sem dor de cabeça com CORS/CSRF). O SSR fala com o backend internamente.

# Preserva o X-Forwarded-Proto de um proxy de borda (ex.: Nginx Proxy Manager terminando TLS);
# sem borda, usa o esquema da conexão direta.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    # DNS embutido do Docker. Combinado com upstreams em variáveis (abaixo), faz o nginx
    # re-resolver os hosts em runtime — assim recriar backend/frontend (novos IPs no rebuild)
    # não derruba o gateway com 502 de DNS obsoleto.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Tamanho de upload de mídia (RF03).
    client_max_body_size 25m;

    # Headers de segurança (aplicados a todas as respostas do gateway, inclusive a app SSR).
    # A CSP permite inline para hidratação/estilos do Angular e imagens do MinIO (http em dev).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: http: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # API do backend.
    location /api/ {
        set $upstream_backend http://backend:8080;
        proxy_pass $upstream_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Sindicação e descoberta (SEO): RSS, sitemap e robots servidos pelo backend.
    location ~ ^/(feed\.xml|sitemap\.xml|robots\.txt)$ {
        set $upstream_backend http://backend:8080;
        proxy_pass $upstream_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Documentação OpenAPI / Swagger UI do backend.
    location ~ ^/(swagger-ui|v3/api-docs|actuator) {
        set $upstream_backend http://backend:8080;
        proxy_pass $upstream_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Tudo o mais vai para o servidor SSR do Angular.
    location / {
        set $upstream_frontend http://frontend:4000;
        proxy_pass $upstream_frontend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
