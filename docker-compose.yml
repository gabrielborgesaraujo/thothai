services:
  postgres:
    image: postgres:17
    container_name: thothai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-thothai}
      POSTGRES_USER: ${POSTGRES_USER:-thothai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thothai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thothai} -d ${POSTGRES_DB:-thothai}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: thothai-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cria o bucket padrão na subida do MinIO e o deixa com leitura pública (URLs de mídia).
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing local/${MINIO_BUCKET:-thothai-media};
      mc anonymous set download local/${MINIO_BUCKET:-thothai-media};
      exit 0;
      "

  backend:
    build:
      context: ./backend
    container_name: thothai-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-thothai}
      DB_USERNAME: ${POSTGRES_USER:-thothai}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-thothai}
      # Endpoint interno (backend -> minio) e URL pública (navegador -> minio).
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_URL: http://localhost:${MINIO_PORT:-9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-thothai-media}
      # Admin único (RF01).
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      # Origem do navegador = gateway (origem única).
      FRONTEND_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8088}
      # Provedores externos (RF04/RF05) — opcionais até a EPIC 5.
      AI_PROVIDER: ${AI_PROVIDER:-claude}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-8}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-tavily}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}

  frontend:
    build:
      context: ./frontend
    container_name: thothai-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: 4000
      # URL absoluta usada pelo SSR para buscar dados no backend (server-side).
      BACKEND_ORIGIN: http://backend:8080

  # Gateway de origem única: navegador -> :80; roteia / para o SSR e /api para o backend.
  gateway:
    image: nginx:alpine
    container_name: thothai-gateway
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "${PUBLIC_PORT:-8088}:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres-data:
  minio-data:
