# Ambiente de PRODUÇÃO — toda a configuração vem do .env (sem defaults embutidos).
# Segredos obrigatórios usam ${VAR:?...}: o compose aborta com erro claro se faltarem.
# Suba com: `docker compose -f docker-compose.prod.yml --env-file .env up -d --build`.
# Recomenda-se terminar TLS num proxy/borda à frente do gateway e usar SESSION_COOKIE_SECURE=true.
services:
  postgres:
    image: postgres:17
    container_name: thothai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
    # Sem portas publicadas: o banco fica acessível apenas na rede interna do compose.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: thothai-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?defina MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD}
    ports:
      # Publica apenas a porta de objetos (mídias). O console (9001) fica interno.
      - "${MINIO_PORT}:9000"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cria o bucket na subida do MinIO e o deixa com leitura pública (URLs de mídia).
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/${MINIO_BUCKET:?defina MINIO_BUCKET};
      mc anonymous set download local/${MINIO_BUCKET};
      exit 0;
      "

  backend:
    build:
      context: ./backend
    container_name: thothai-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      # URL pública das mídias, alcançável pelo navegador (ex.: CDN ou host:porta publicada).
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:?defina MINIO_PUBLIC_URL}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?defina ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?defina ADMIN_PASSWORD}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:?defina SESSION_COOKIE_SECURE (true atrás de HTTPS)}
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:?defina SESSION_TIMEOUT}
      FRONTEND_ORIGIN: ${PUBLIC_ORIGIN:?defina PUBLIC_ORIGIN}
      # Base das URLs absolutas em feed.xml/sitemap.xml/robots.txt e do link de reset de senha.
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?defina PUBLIC_ORIGIN}
      # E-mail transacional (reset de senha) — opcional: sem SMTP, o conteúdo é apenas logado.
      SPRING_MAIL_HOST: ${SMTP_HOST:-}
      SPRING_MAIL_PORT: ${SMTP_PORT:-587}
      SPRING_MAIL_USERNAME: ${SMTP_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SMTP_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
      THOTHAI_MAIL_FROM: ${SMTP_FROM:-no-reply@thothai.local}
      # IA/busca (RF04/RF05) — opcionais; deixe vazias para desabilitar.
      AI_PROVIDER: ${AI_PROVIDER}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER}
      TAVILY_API_KEY: ${TAVILY_API_KEY}

  frontend:
    build:
      context: ./frontend
    container_name: thothai-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: 4000
      BACKEND_ORIGIN: http://backend:8080
      # Hosts públicos autorizados pelo SSR (allowlist anti-SSRF) — defina o domínio real.
      NG_ALLOWED_HOSTS: ${NG_ALLOWED_HOSTS:?defina NG_ALLOWED_HOSTS}

  gateway:
    image: nginx:alpine
    container_name: thothai-gateway
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "${PUBLIC_PORT}:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres-data:
  minio-data:
